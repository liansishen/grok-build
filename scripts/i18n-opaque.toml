# User-visible strings that are intentionally kept verbatim by the i18n audit.
#
# Exact values are preferred. Prefixes are limited to protocol and command
# namespaces; do not add a whole module or file as an exception.

[scan]
roots = [
  "crates/codegen/xai-grok-pager/src",
  "crates/codegen/xai-grok-shell/src",
  "crates/codegen/xai-grok-workspace/src",
]

# Full-prose UI modules are scanned even when strings flow through locals or format!.
current_full_scan_roots = [
  "crates/codegen/xai-grok-pager/src/views/tasks_pane.rs",
  "crates/codegen/xai-grok-pager/src/views/dashboard",
]
# Markdown trees are checked by relative path against their translation trees.
docs_roots = [
  "crates/codegen/xai-grok-pager/docs/user-guide",
]
translated_docs_roots = [
  "crates/codegen/xai-grok-pager/docs/user-guide/zh-CN",
]
sinks = [
  "show_toast",
  "show_toast_ticks",
  "Span::raw",
  "Span::styled",
  "Span::from",
  "Line::from",
  "Line::raw",
  "Line::styled",
  "Line::from_iter",
  "Text::from",
  "Paragraph::new",
  "Block::title",
  "Block::title_bottom",
  "ListItem::new",
  "Cell::from",
  "Table::new",
  "set_string",
  "set_span",
  "println",
  "eprintln",
  "print",
  "HintItem::new",
  "HintItem::paired",
]
translation_functions = [
  "t",
  "t_for",
  "t_fmt",
  "t_or",
  "intern_key",
  "label_t",
  "description_t",
  "display_t",
]
excluded_path_fragments = [
  "/tests/",
  "/tests.rs",
  "/examples/",
  "/bin/",
  "/testkit/",
  "_tests.rs",
]
settings_files = [
  "crates/codegen/xai-grok-pager/src/views/settings_modal/render.rs",
  "crates/codegen/xai-grok-pager/src/views/settings_modal/state.rs",
]

[allow]
# Keyboard names, product/protocol names, and slash-command tokens are opaque
# values rather than prose to translate.
exact = [
  "Alt",
  "Backspace",
  "Ctrl",
  "Enter",
  "Esc",
  "F1",
  "F2",
  "Grok Build",
  "MCP",
  "PageDown",
  "PageUp",
  "Shift",
  "Space",
  "Tab",
  "URL",
  "XAI_API_KEY",
  "n",
  "h",
  "q",
  "y",
]
prefix = [
  "/",
  "./",
  "../",
  "http://",
  "https://",
  "ws://",
  "wss://",
  "file://",
  "mailto:",
  "git@",
]
