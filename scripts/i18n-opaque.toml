# User-visible strings that are intentionally kept verbatim by the i18n audit.
#
# Exact values are preferred. Prefixes are limited to protocol and command
# namespaces; do not add a whole module or file as an exception.

[scan]
# Every first-party workspace source tree is scanned, so a new crate or a new
# render mode cannot silently fall outside the audit. `third_party/` holds
# vendored upstream sources and is covered by its own upstream project, not by
# this fork's localization.
roots = [
  "crates",
  "prod",
]

# The full-prose pass runs over the same trees as `roots`: every first-party file is checked for
# copy reaching a terminal-UI sink, whether it is written inline, through a local, or into a buffer.
current_full_scan_roots = [
  "crates",
  "prod",
]
# Markdown trees are checked by relative path against their translation trees.
docs_roots = [
  "crates/codegen/xai-grok-pager/docs/user-guide",
]
translated_docs_roots = [
  "crates/codegen/xai-grok-pager/docs/user-guide/zh-CN",
]
sinks = [
  "show_toast",
  "show_toast_ticks",
  "Span::raw",
  "Span::styled",
  "Span::from",
  "Line::from",
  "Line::raw",
  "Line::styled",
  "Line::from_iter",
  "Text::from",
  "Paragraph::new",
  "Block::title",
  "Block::title_bottom",
  "ListItem::new",
  "Cell::from",
  "Table::new",
  "set_string",
  "set_span",
  "println",
  "eprintln",
  "print",
  "HintItem::new",
  "HintItem::paired",
]
# Sinks whose output the user reads inside the terminal UI. Every first-party Rust file is scanned
# for copy reaching one of these, however it is laundered through locals or `format!`. The CLI
# `print*` sinks stay in `sinks` only: the fork's non-goals keep CLI help, error and log lines out
# of the translation surface (new or changed ones are still gated by the diff audit).
prose_sinks = [
  "show_toast",
  "show_toast_ticks",
  "Span::raw",
  "Span::styled",
  "Span::from",
  "Line::from",
  "Line::raw",
  "Line::styled",
  "Line::from_iter",
  "Text::from",
  "Paragraph::new",
  "Block::title",
  "Block::title_bottom",
  "ListItem::new",
  "Cell::from",
  "Table::new",
  "set_string",
  "set_span",
  "HintItem::new",
  "HintItem::paired",
]
translation_functions = [
  "t",
  "t_for",
  "t_fmt",
  "t_or",
  "tr",
  "tr_for",
  "tr_fmt",
  "tr_fmt_for",
  "intern_key",
  "label_t",
  "description_t",
  "display_t",
]
excluded_path_fragments = [
  "/tests/",
  "/tests.rs",
  "/examples/",
  "/benches/",
  "/bin/",
  "/testkit/",
  "_tests.rs",
]
settings_files = [
  "crates/codegen/xai-grok-pager/src/views/settings_modal/render.rs",
  "crates/codegen/xai-grok-pager/src/views/settings_modal/state.rs",
]

[allow]
# Keyboard names, product/protocol names, and slash-command tokens are opaque
# values rather than prose to translate.
exact = [
  "Alt",
  "Backspace",
  "Ctrl",
  "Enter",
  "Esc",
  "F1",
  "F2",
  "Grok Build",
  "MCP",
  "PageDown",
  "PageUp",
  "Shift",
  "Space",
  "Tab",
  "URL",
  "XAI_API_KEY",
  "n",
  "h",
  "q",
  "y",
  "z",
  # ANSI dim/reset wrapper around catalog copy (the sentence itself is a
  # `t(...)` lookup); terminal control sequences are never translated.
  "\u001b[90m{}\u001b[0m",
  # Keyboard chords, the Mermaid diagram-language tokens and label, and the GBOOM overlay's title:
  # opaque values rather than prose to translate.
  "Ctrl+Y",
  "TB",
  "GBOOM",
  # Fixed-width numeric marker (`{pct:.2}%`-style column): 5 cells by contract, never translated.
  "MAX %",
  "mermaid: {header}",
  # Key/chord tokens, layout-only fragments, and compared identifiers (grammars, path
  # components, protocol states) are matched or measured, never read as prose.
  "L{}",
  "SIGKILL",
  "SIGTERM",
  "[Esc]",
  "[x]",
  "active",
  "bash",
  "bundled",
  "ctrl+d",
  "ctrl+q",
  "ctrl+u",
  "done",
  "e",
  "enter",
  "esc",
  "f",
  "json",
  "killed",
  "logs",
  "oom",
  "personas",
  "powershell",
  "{prefix}P {}",
  "{pos}-{end}/{total}  ↑↓  [Esc]",
  "{pos}-{end}/{total}  [Esc]",
  "{}x{} {}",
  # Stderr diagnostics rather than UI copy: telemetry log-setup failures and the test harness
  # timer. The fork's non-goals keep logs out of the translation surface, so they stay verbatim.
  "Failed to create instrumentation log directory {:?}: {}",
  "Failed to open instrumentation log file {:?}: {}",
  "Failed to create chrome trace directory {:?}: {}",
  "Failed to open chrome trace file {:?}: {}",
  "[harness-timing] {what}: {:?}",
  # Slash-command name echoed as a block header (`/btw <question>`); the command token is opaque.
  "/btw {}",
  # `grok trace` CLI stderr (non-goals: CLI help/errors stay English). Line-continued
  # Rust strings keep the newline-plus-indent the audit decoder produces.
  "Found session at: {}",
  """Trace upload is off for this account (data retention opted out or not yet 
                     confirmed); exporting locally.""",
  """No upload credentials for this account (run `grok login` or set a deployment 
                     key); exporting locally.""",
  "Per-turn trace skipped: {}",
  """Per-turn trace: {} of {} turns reconstructed; {} artifacts uploaded, 
                             {} already present, {} skipped (size), {} failed{in_flight_note}""",
]
prefix = [
  "./",
  "../",
  "http://",
  "https://",
  "ws://",
  "wss://",
  "file://",
  "mailto:",
  "git@",
]
