"tool.description.lifecycle.task_output" = "Get output and status from a background task{target_suffix}.\n\nUsage notes:\n- Pass {task_ids_param} with one or more ids from {sources}{monitor_note}; for a single task use a one-element array. Multiple ids with a positive {timeout_ms_param} wait until all complete\n- Omit {timeout_ms_param} or pass 0 for a non-blocking status snapshot; set a positive {timeout_ms_param} to wait up to that many milliseconds, capped at {wait_cap}\n- Returns current output, status, and exit code if completed{read_note}"
"tool.description.lifecycle.wait_tasks" = "Wait for multiple background tasks or subagents to complete.\n\nPrefer {background_retrieval_tool} with task_ids and a positive timeout_ms. This tool is kept for compatibility.\n\nUsage notes:\n- task_ids: list of task IDs from {sources}\n- mode: 'wait_all' or 'wait_any'\n- timeout_ms: optional max wait, default 30s, capped at {wait_cap}"
"tool.scheduler.description.create" = "Create a scheduled task that runs a prompt on a recurring interval, or update an existing one in place.\n\nUse this tool when a user asks you to loop, repeat, or schedule a prompt or a task.\n\nSet fire_immediately: true to also fire once on creation; by default the first run waits for the interval.\n\nTo change an existing task, pass its task_id: provided fields replace old fields, omitted ones are unchanged, and the schedule keeps its phase. An unknown id errors.\n\nUsage notes:\n- Interval format: '5m' (minutes), '2h' (hours), '1d' (days), '60s' (seconds, min 60)\n- Maximum 50 scheduled tasks at once\n- Tasks auto-expire after {ttl} days\n- For one-time delayed work, run a background terminal command (e.g. `sleep 1800 && <command>`) instead; its completion notifies you"
