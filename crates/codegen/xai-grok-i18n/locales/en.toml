'tool.description.grok_build_concise.performs_exact_string_replacements_in_files' = '''Replace an exact string in a file.

- Do not include the "LINE_NUMBER→" prefixes from file reads in ${{ params.edit.old_string }} or ${{ params.edit.new_string }}; keep the exact indentation.
- ${{ params.edit.old_string }} must match exactly one place in the file. If it appears more than once, add surrounding lines to make it unique, or set ${{ params.edit.replace_all }} to change every occurrence (handy for renaming an identifier).
- To create a new file, set ${{ params.edit.old_string }} to an empty string.'''
'tool.description.edit_a_file_using_anchors_if_tools_by_kind_read_and_tools_by_kind_search_from_tools_by_kind_read_or_tools_by_kind_search_elif_tools_by_kind_read_from_tools_by_kind_read_elif_tools_by_kind_search_from_tools_by_kind_search_endif' = '''Edit a file using anchors${%- if tools.by_kind.read and tools.by_kind.search %} from ${{ tools.by_kind.read }} or ${{ tools.by_kind.search }}${%- elif tools.by_kind.read %} from ${{ tools.by_kind.read }}${%- elif tools.by_kind.search %} from ${{ tools.by_kind.search }}${%- endif %}.

Operations (use the "op" field):

  "replace" — Replace one line or a range with new content.
    { "op": "replace", "anchor": "{example_anchor}", "content": "    let x = 42;" }
    Range: add "end_anchor" to replace from anchor through end_anchor (INCLUSIVE —
    both the anchor line and end_anchor line are replaced along with everything
    between them). If the anchor or end_anchor line contains a closing delimiter
    like `}` that must be preserved, include it in "content".
    Delete one line: { "op": "replace", "anchor": "{example_anchor}", "content": "" }
    Delete a range: { "op": "replace", "anchor": "{example_anchor}", "end_anchor": "...", "content": "" }

  "insert_after" — Insert new lines after the anchored line.
    { "op": "insert_after", "anchor": "{example_anchor}", "content": "    let y = 1;" }
    Add a blank line: { "op": "insert_after", "anchor": "{example_anchor}", "content": "" }
    Multi-line insert: content with newlines adds multiple lines.
    Beginning of file: use "0:" as anchor.
    End of file: use "EOF" as anchor.
    Existing lines below the anchor are preserved — only include new content.
    Prefer insert_after over replace when adding lines without removing existing ones.

  "write" — Replace entire file content (no anchors needed).
    { "op": "write", "content": "full file content here" }

Batch edits: pass multiple operations in "${{ params.edit.edits }}". They are validated against the
pre-edit snapshot and applied atomically bottom-up — if any anchor fails
validation, ALL edits in the batch are rejected (none are applied).
Overlapping ranges are also rejected.

Range safety:
- Multi-line edits may return caution warnings, especially for broader rewrites.
- Larger rewrites are allowed, but use them when you are confident about the target range.
- For very large rewrites (most of the file), prefer a single "write" op over many replace ops.

Follow-up edits:
- On success, the tool returns a snippet with fresh anchors around the edited region.
- On stale-anchor errors, the tool returns fresh anchors around the target line.
  Use these anchors to immediately retry your edit — do not re-read the file.
- The anchor is the full "LINE:HASH" or "LINE:HASH:HASH" before the → separator
  (e.g. "{example_anchor}"). Always include the line number. Do NOT include → or
  the line content after it.
- Never fabricate or modify anchors — only use exact anchors as returned by
  previous tool outputs.'''
'tool.description.search_file_contents_with_anchor_annotated_results_if_tools_by_kind_edit_for_use_with_tools_by_kind_edit_endif' = '''Search file contents with anchor-annotated results${%- if tools.by_kind.edit %} for use with ${{ tools.by_kind.edit }}${%- endif %}.

Match lines include anchors${%- if tools.by_kind.edit %} you can pass directly to ${{ tools.by_kind.edit }}${%- if tools.by_kind.read %} without needing to ${{ tools.by_kind.read }} the file first${%- endif %}${%- endif %}. This grep format keeps grep-style separators after the anchor: `:` for
match lines and `-` for context lines.

Content output format:

  {grep_match}    ← match (:)
  {grep_context}    ← context (-)

Usage:
- ${{ params.search.pattern }} is a regex: `log.*Error`, `function\s+\w+`, `TODO`
- Default output is anchored content matches (no output-mode selector)
- Use -A, -B, -C for context lines around matches
- Only use '${{ params.search.type }}' or '${{ params.search.glob }}' when certain of the file type
- Results are capped; truncated results show "at least" counts'''
'tool.description.read_a_file_with_line_anchored_output_if_tools_by_kind_edit_for_use_with_tools_by_kind_edit_endif' = '''Read a file with line-anchored output${%- if tools.by_kind.edit %} for use with ${{ tools.by_kind.edit }}${%- endif %}.

Each line is formatted as ANCHOR→CONTENT, for example:
{example_line1}
{example_line2}

This read format uses `→` between the anchor and content.${%- if tools.by_kind.search %} By contrast,
${{ tools.by_kind.search }} keeps grep-style separators after the anchor: `:` for
match lines and `-` for context lines.${%- endif %}

The ANCHOR (e.g. "{example_anchor}") is a compact fingerprint of the line's content
and surrounding context.${%- if tools.by_kind.edit %} Pass anchors to ${{ tools.by_kind.edit }} to make edits —
they verify the targeted location still matches the snapshot you saw.
Anchors are valid only for the file state at read time — after any edit,
use the fresh anchors returned by ${{ tools.by_kind.edit }} or re-read the file.${%- endif %}

Usage:
- The ${{ params.read.target_file }} parameter accepts either a relative path in the workspace or an absolute path
- By default reads up to {max_lines_read} lines from the beginning
- Optionally specify ${{ params.read.offset }} and ${{ params.read.limit }} for large files
- Can read images (PNG, JPG, etc.) and PDF files (each page rendered as an image; use ${{ params.read.pages }} for PDFs with more than 10 pages, max 20 per call)
- You can call multiple tools in a single response
- If you read a file that exists but has empty contents you will receive a system reminder warning in place of file contents.'''
'tool.description.read_a_file' = '''Read a file.

Usage:
- The ${{ params.read.target_file }} parameter can be a relative path in the workspace or an absolute path
- By default, it reads up to {max_lines_read} lines starting from the beginning of the file
- Line numbers (1-based) appear as anchors in the format LINE_NUMBER→LINE_CONTENT on the first returned line and on every 10th line of the file; the lines in between show content only. Count from the nearest anchor when referring to a specific line
- This tool can read PDF files (.pdf), PowerPoint files (.pptx), Jupyter notebooks (.ipynb files), and image files (e.g. PNG, JPG, etc).
- When reading an image file the contents are presented visually as this tool uses multimodal LLMs.'''
'tool.description.grok_build.performs_exact_string_replacements_in_files' = '''Replace an exact string in a file.

${% if tools.by_kind.read -%}
