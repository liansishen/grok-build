'tool.description.reads_a_file_or_directory_from_the_local_filesystem_you_can_access_any_file_directly_by_using_this_tool' = '''Reads a file or directory from the local filesystem. You can access any file directly by using this tool.
Assume this tool is able to read all files on the machine. If the User provides a path to a file assume that path is valid. It is okay to read a file that does not exist; an error will be returned.

Usage:
- The ${{ params.read.filePath }} parameter must be an absolute path, not a relative path
- By default, it reads up to 2000 lines starting from the beginning of the file
- You can optionally specify ${{ params.read.offset }} and ${{ params.read.limit }} (especially handy for long files), but it's recommended to read the whole file by not providing these parameters
- Any lines longer than {max_chars_per_line} characters will be truncated
- Contents are returned with each line prefixed by its line number as `LINE_NUMBER: LINE_CONTENT`, with line numbers starting at 1. For example, if the file has contents "foo\n", you will receive "1: foo"
- For directories, entries are returned one per line (without line numbers) with a trailing `/` for subdirectories
- This tool can read images (eg PNG, JPG, etc). When reading an image file the contents are presented visually as this tool uses multimodal LLMs.
- This tool can read PDF files (.pdf). PDFs are presented visually to the multimodal LLM as attachments.
- You can call multiple tools in a single response. It is always better to speculatively read multiple potentially useful files in parallel.
- You will regularly be asked to read screenshots. If the user provides a path to a screenshot, ALWAYS use this tool to view the file at the path. This tool will work with all temporary file paths.
- If you read a file that exists but has empty contents you will receive a system reminder warning in place of file contents.'''
'tool.description.load_a_specialized_skill_that_provides_domain_specific_instructions_and_workflows' = '''Load a specialized skill that provides domain-specific instructions and workflows.

When you recognize that a task matches one of the available skills listed below, use this tool to load the full skill instructions.

The skill will inject detailed instructions, workflows, and access to bundled resources into the conversation via a `<skill_content name="...">` block with the loaded content.

The following skills provide specialized sets of instructions for particular tasks.
Invoke this tool to load a skill when a task matches one of the available skills listed below:

<available_skills>
${%- if skills %}
${%- for skill in skills %}
  <skill>
    <name>${{ skill.name }}</name>
    <description>${{ skill.description|e }}</description>
    <location>${{ skill.location }}</location>
  </skill>
${%- endfor %}
${%- else %}
(No skills available. Skills can be added in ~/.grok/skills/ or .grok/skills/)
${%- endif %}
</available_skills>'''
'tool.description.opencode.performs_exact_string_replacements_in_files' = '''Performs exact string replacements in files.

Usage:${%- if tools.by_kind.read %}
- When editing text from ${{ tools.by_kind.read }} tool output, ensure you preserve the exact indentation (tabs/spaces) as it appears AFTER the line number prefix. The line number prefix format is: line number + ": ". Everything after that ": " separator is the actual file content to match. Never include any part of the line number prefix in the ${{ params.edit.oldString }} or ${{ params.edit.newString }}.${%- endif %}
- ALWAYS prefer editing existing files in the codebase. NEVER write new files unless explicitly required.
- The edit will FAIL if `${{ params.edit.oldString }}` is not unique in the file. Either provide a larger string with more surrounding context to make it unique or use `${{ params.edit.replaceAll }}` to change every instance of `${{ params.edit.oldString }}`.
- Use `${{ params.edit.replaceAll }}` for replacing and renaming strings across the file. This parameter is useful if you want to rename a variable for instance.
- To create a new file, set ${{ params.edit.oldString }} to an empty string.
- Only use emojis if the user explicitly requests it. Avoid adding emojis to files unless asked.'''
'tool.description.executes_a_given_bash_command_in_a_shell_session_with_optional_timeout_ensuring_proper_handling_and_security_measures_each_command_runs_in_a_fresh_shell_working_directory_changes_and_environment_variables_do_not_persist_between_calls' = '''Executes a given bash command in a shell session with optional timeout, ensuring proper handling and security measures. Each command runs in a fresh shell: working directory changes and environment variables do not persist between calls.
IMPORTANT: This tool is for terminal operations like git, npm, docker, etc. DO NOT use it for file operations (reading, writing, editing, searching, finding files) - use the specialized tools for this instead.

Before executing the command, please follow these steps:

1. Directory Verification:
   - If the command will create new directories or files, first use `ls` to verify the parent directory exists and is the correct location
   - For example, before running "mkdir foo/bar", first use `ls foo` to check that "foo" exists and is the intended parent directory

2. Command Execution:
   - Always quote file paths that contain spaces with double quotes (e.g., rm "path with spaces/file.txt")
   - Examples of proper quoting:
     - mkdir "/Users/name/My Documents" (correct)
     - mkdir /Users/name/My Documents (incorrect - will fail)
     - python "/path/with spaces/script.py" (correct)
     - python /path/with spaces/script.py (incorrect - will fail)
   - After ensuring proper quoting, execute the command.
   - Capture the output of the command.

Usage notes:
  - The ${{ params.execute.command }} argument is required.
  - You can specify an optional ${{ params.execute.timeout }} in milliseconds. If not specified, commands will use the default timeout.
  - It is very helpful if you write a clear, concise description of what this command does in 5-10 words.
  - If the output exceeds {max_output_bytes} characters, output will be truncated before being returned to you.
${%- if tools.by_kind.list or tools.by_kind.search or tools.by_kind.read or tools.by_kind.edit or tools.by_kind.write %}
${%- if has_unix_utilities %}
  - Avoid using this tool with the `find`, `grep`, `cat`, `head`, `tail`, `sed`, `awk`, or `echo` commands, unless explicitly instructed or when these commands are truly necessary for the task. Instead, always prefer using the dedicated tools for these commands:${%- if tools.by_kind.list %}
    - File search: Use the ${{ tools.by_kind.list }} tool (NOT the `find` or `ls` shell commands)${%- endif %}${%- if tools.by_kind.search %}
    - Content search: Use the ${{ tools.by_kind.search }} tool (NOT the `grep` or `rg` shell commands)${%- endif %}${%- if tools.by_kind.read %}
    - Read files: Use ${{ tools.by_kind.read }} (NOT cat/head/tail)${%- endif %}${%- if tools.by_kind.edit %}
    - Edit files: Use ${{ tools.by_kind.edit }} (NOT sed/awk)${%- endif %}${%- if tools.by_kind.write %}
    - Write files: Use ${{ tools.by_kind.write }} (NOT echo >/cat <<EOF)${%- endif %}
    - Communication: Output text directly (NOT echo/printf)
${%- else %}
  - The Unix utilities `grep`, `head`, `tail`, `sed`, `awk`, and `find` are NOT available in this shell — they will fail with `'<name>' is not recognized` (PowerShell adds `as a cmdlet`; cmd.exe adds `as an internal or external command`). Never invoke them. Use the dedicated tools instead:${%- if tools.by_kind.list %}
    - File search: Use the ${{ tools.by_kind.list }} (NOT `Get-ChildItem` / `gci` / `dir` / `ls`)${%- endif %}${%- if tools.by_kind.search %}
    - Content search: Use the ${{ tools.by_kind.search }} (NOT `Select-String` / `sls`)${%- endif %}${%- if tools.by_kind.read %}
    - Read files: Use the ${{ tools.by_kind.read }} (NOT `Get-Content` / `gc` / `cat`)${%- endif %}${%- if tools.by_kind.edit %}
    - Edit files: Use the ${{ tools.by_kind.edit }} (NOT `(Get-Content ...) -replace ... | Set-Content`; `sed` and `awk` are unavailable)${%- endif %}${%- if tools.by_kind.write %}
    - Write files: Use the ${{ tools.by_kind.write }} (NOT `Set-Content` / `Out-File` / `echo >`)${%- endif %}
    - Communication: Output text directly (NOT `Write-Output` / `echo`)
${%- endif %}
${%- endif %}
  - When issuing multiple commands:
    - If the commands are independent and can run in parallel, make multiple calls to this tool in a single message. For example, if you need to run "git status" and "git diff", send a single message with two tool calls in parallel.
    - If the commands depend on each other and must run sequentially, use a single call with '&&' to chain them together (e.g., `git add . && git commit -m "message" && git push`).${%- if tools.by_kind.edit %} For instance, if one operation must complete before another starts (like mkdir before cp, ${{ tools.by_kind.edit }} before this tool for git operations, or git add before git commit), run these operations sequentially instead.${%- endif %}
    - Use ';' only when you need to run commands sequentially but don't care if earlier commands fail
    - DO NOT use newlines to separate commands (newlines are ok in quoted strings)
  - Try to maintain your current working directory throughout the session by using absolute paths and avoiding usage of `cd`. You may use `cd` if the User explicitly requests it.

# Committing changes with git

Only create commits when requested by the user. If unclear, ask first. When the user asks you to create a new git commit, follow these steps carefully:

Git Safety Protocol:
- NEVER update the git config
- NEVER run destructive/irreversible git commands (like push --force, hard reset, etc) unless the user explicitly requests it
- NEVER skip hooks (--no-verify, --no-gpg-sign, etc) unless the user explicitly requests it
- NEVER use force push to main/master; warn the user if they request it
- Avoid git commit --amend. ONLY use --amend when ALL conditions are met:
  (1) User explicitly requested amend, OR commit SUCCEEDED but pre-commit hook auto-modified files that need including
  (2) HEAD commit was created by you in this conversation (verify: git log -1 --format='%an %ae')
  (3) Commit has NOT been pushed to remote (verify: git status shows "Your branch is ahead")
- CRITICAL: If commit FAILED or was REJECTED by hook, NEVER amend - fix the issue and create a NEW commit
- CRITICAL: If you already pushed to remote, NEVER amend unless user explicitly requests it (requires force push)
- NEVER commit changes unless the user explicitly asks you to. It is VERY important to only commit files when requested by the user.

1. You can call multiple tools in a single response. When multiple independent pieces of information are requested and all commands are likely to succeed, send the following bash commands in parallel:
  - Run a git status command to see all untracked files.
  - Run a git diff command to see both staged and unstaged changes that will be committed.
  - Run a git log command to see recent commit messages, so that you can follow this repository's commit message style.
2. Analyze all staged changes (both previously staged and newly added) and draft a commit message:
  - Summarize the nature of the changes and their purpose.
  - Do not commit files that likely contain secrets (.env, credentials.json, etc.). Warn the user if they specifically request those files.
  - Draft a concise commit message that focuses on the reason for the changes.
  - Ensure it accurately reflects the changes and their purpose.
3. You can call multiple tools in a single response. When multiple independent pieces of information are requested and all commands are likely to succeed, send the following commands:
   - Add relevant untracked files to the staging area.
   - Create the commit with a message.
   - Run git status after the commit completes to verify success.
   Note: git status depends on the commit completing, so run it sequentially after the commit.
4. If the commit fails due to a pre-commit hook, fix the issue and create a NEW commit.

Important notes:
- NEVER run additional commands to read or explore code, besides git bash commands
- DO NOT push to the remote repository unless the user explicitly asks you to do so
- IMPORTANT: Never use git commands with the -i flag since they require interactive input which is not supported.
- If there are no changes to commit (i.e., no untracked files and no modifications), do not create an empty commit

# Creating pull requests
Use the gh command via this tool for ALL GitHub-related tasks including working with issues, pull requests, checks, and releases. If given a GitHub URL use the gh command to get the information needed.

IMPORTANT: When the user asks you to create a pull request, follow these steps carefully:

1. You can call multiple tools in a single response. When multiple independent pieces of information are requested and all commands are likely to succeed, run the following commands in parallel using this tool, in order to understand the current state of the branch since it diverged from the main branch:
   - Run a git status command to see all untracked files
   - Run a git diff command to see both staged and unstaged changes that will be committed
   - Check if the current branch tracks a remote branch and is up to date with the remote, so you know if you need to push to the remote
   - Run a git log command and `git diff [base-branch]...HEAD` to understand the full commit history of the branch
2. Analyze all changes that will be included in the pull request and draft a pull request summary.
3. Create the PR with `gh pr create` and return its URL.
'''
'tool.description.todowrite' = '''Use this tool to create and manage a structured task list for your current coding session. This helps you track progress, organize complex tasks, and demonstrate thoroughness to the user.
It also helps the user understand the progress of the task and overall progress of their requests.

## When to Use This Tool
Use this tool proactively in these scenarios:

1. Complex multistep tasks - When a task requires 3 or more distinct steps or actions
2. Non-trivial and complex tasks - Tasks that require careful planning or multiple operations
3. User explicitly requests todo list - When the user directly asks you to use the todo list
4. User provides multiple tasks - When users provide a list of things to be done (numbered or comma-separated)
5. After receiving new instructions - Immediately capture user requirements as todos. Feel free to edit the todo list based on new information.
6. After completing a task - Mark it complete and add any new follow-up tasks
7. When you start working on a new task, mark the todo as in_progress. Ideally you should only have one todo as in_progress at a time. Complete existing tasks before starting new ones.

## When NOT to Use This Tool

Skip using this tool when:
1. There is only a single, straightforward task
2. The task is trivial and tracking it provides no organizational benefit
3. The task can be completed in less than 3 trivial steps
4. The task is purely conversational or informational

NOTE that you should not use this tool if there is only one trivial task to do. In this case you are better off just doing the task directly.

## Examples of When to Use the Todo List

<example>
User: I want to add a dark mode toggle to the application settings. Make sure you run the tests and build when you're done!
Assistant: I'll help add a dark mode toggle to your application settings. Let me create a todo list to track this implementation.
*Creates todo list with the following items:*
1. Create dark mode toggle component in Settings page
2. Add dark mode state management (context/store)
3. Implement CSS-in-JS styles for dark theme
4. Update existing components to support theme switching
5. Run tests and build process, addressing any failures or errors that occur
*Begins working on the first task*

<reasoning>
The assistant used the todo list because:
1. Adding dark mode is a multi-step feature requiring UI, state management, and styling changes
2. The user explicitly requested tests and build be run afterward
3. The assistant inferred that tests and build need to pass by adding "Ensure tests and build succeed" as the final task
</reasoning>
</example>

<example>
User: Help me rename the function getCwd to getCurrentWorkingDirectory across my project
Assistant: Let me first search through your codebase to find all occurrences of 'getCwd'.
*Uses grep or search tools to locate all instances of getCwd in the codebase*
Assistant: I've found 15 instances of 'getCwd' across 8 different files. Let me create a todo list to track this implementation.
*Creates todo list with specific items for each file that needs updating*

<reasoning>
The assistant used the todo list because:
1. First, the assistant searched to understand the scope of the task
2. Upon finding multiple occurrences across different files, it determined this was a complex task requiring multiple steps
3. The todo list helps ensure every instance is tracked and systematically addressed
4. This approach prevents missing any occurrence and maintains code consistency
