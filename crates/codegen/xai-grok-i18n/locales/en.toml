"shortcuts.pseudo.paste_long_help_windows" = "Pastes clipboard images into the prompt as chips, and plain text as typed.\nPrefer Ctrl+V. Use Alt+V as a fallback when Ctrl+V fails (some terminals or configs drop image clipboards; older Windows Terminal versions only pasted text).\nYou can also drag an image file from Explorer into the prompt."
"shortcuts.pseudo.paste_long_help_macos" = "Pastes clipboard images into the prompt as chips, and plain text as typed.\nUse Ctrl+V for screenshots, browser \"Copy Image\", and file-manager image copies (many terminals swallow Cmd+V and never deliver it to the TUI).\nYou can also drag an image file into the prompt."
"shortcuts.pseudo.paste_long_help_other" = "Pastes clipboard images into the prompt as chips, and plain text as typed.\nUse Ctrl+V for screenshots, browser \"Copy Image\", and file-manager image copies.\nYou can also drag an image file into the prompt."
"shortcuts.pseudo.undo_long_help" = "Undoes the last change in the prompt editor.\nCovers typing, deletes, line/word kills, and clearing a draft."
"shortcuts.pseudo.redo_long_help" = "Redoes the last undone change in the prompt editor.\nCtrl+Shift+Z is primary; Ctrl+R is an alternate."
"shortcuts.pseudo.history_long_help" = "Recalls previously sent prompts.\nPress Up on an empty prompt to browse earlier prompts, newest first; each move live-populates the composer so you can edit and resend.\nWith prompts queued, Up moves focus into the queue pane on the last row instead.\nRun /history to open a searchable history panel and filter by text."
"shortcuts.pseudo.search_scrollback_long_help" = "Searches the conversation scrollback for text and jumps between matches.\nIn the prompt input, run /find to search. In vim mode, you can also press / while the scrollback is focused.\nType a query, then use n and N (or the arrow keys) to step through matches. Press Enter to jump to a match and Esc to dismiss."
