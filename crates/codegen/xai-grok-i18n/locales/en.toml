'tool.description.reads_a_file_from_the_computer_s_filesystem_you_can_access_any_file_directly_by_using_this_tool' = '''Reads a file from the computer's filesystem. You can access any file directly by using this tool.
It is okay to read a file that does not exist; an error will be returned.

