"tool.description.task" = "Start a subagent that works on a task independently and reports back.\n\nAgent types:\n\n{agent_lines}\n\n## Usage notes\n- When the agent is done, it returns a single message with its agent ID. Use that ID to resume the agent later for follow-up work.\n- {run_in_background_param}: Returns immediately with a subagent_id. Use {background_retrieval_tool} to retrieve results. This is set to true by default.\n- Subagents receive a compacted version of project instructions (AGENTS.md). If the task requires detailed conventions (e.g., build rules, testing patterns), include the relevant rules directly in the prompt.\n- When using the {task_tool} tool, you must specify a {subagent_type_param} parameter to select which agent type to use.\n- When launching independent subagents, you MUST incorporate the results into the task based on requirements BEFORE concluding.\n\nResuming a previous agent (resume_from):\n- Use {resume_from_param} to continue a previously completed subagent's conversation. Pass the subagent_id returned by a prior {task_tool} call. A resumed agent keeps its full transcript and tool state, so you only need to describe what changed since the last run -- don't re-explain the original task.\n- The resumed agent must use the same subagent_type as the source.\n\nIsolation mode:\n- Use {isolation_param} to control the child's execution environment. With 'worktree', the child runs in an isolated git worktree whose edits don't affect the parent workspace; the worktree is preserved after completion and its path is returned in the output."
"tool.description.subagent.general_purpose" = "General purpose agent for multi-step tasks."
"tool.description.subagent.explore" = "Fast, read-only agent specialized for codebase exploration."
"tool.description.subagent.plan" = "Software architect for planning implementation strategies."
"tool.description.subagent_tools.general_purpose" = "Has access to: ${{ tools.by_kind.execute }}, ${{ tools.by_kind.read }}, ${{ tools.by_kind.edit }}, ${{ tools.by_kind.list }}, ${{ tools.by_kind.search }}, ${{ tools.by_kind.web_search }}, and ${{ tools.by_kind.plan }}."
"tool.description.subagent_tools.explore" = "Read-only -- has access to: ${{ tools.by_kind.read }}, ${{ tools.by_kind.list }}, ${{ tools.by_kind.search }}."
"tool.description.subagent_tools.plan" = "Read-only -- has access to: ${{ tools.by_kind.read }}, ${{ tools.by_kind.list }}, ${{ tools.by_kind.search }}, ${{ tools.by_kind.web_search }}, and ${{ tools.by_kind.plan }}. File editing and command execution are not available."
