"shortcuts.pseudo.paste_long_help_windows" = "将剪贴板图像作为图片块粘贴到提示词中，纯文本则按原样粘贴。\n首选 Ctrl+V。当 Ctrl+V 失效时使用 Alt+V 作为备选（部分终端或配置会丢弃图像剪贴板；旧版 Windows Terminal 只会粘贴文本）。\n也可以从资源管理器拖拽图像文件到提示词中。"
"shortcuts.pseudo.paste_long_help_macos" = "将剪贴板图像作为图片块粘贴到提示词中，纯文本则按原样粘贴。\n截图、浏览器“复制图像”以及文件管理器复制图像请使用 Ctrl+V（许多终端会吞掉 Cmd+V，无法送达 TUI）。\n也可以将图像文件拖入提示词。"
"shortcuts.pseudo.paste_long_help_other" = "将剪贴板图像作为图片块粘贴到提示词中，纯文本则按原样粘贴。\n截图、浏览器“复制图像”以及文件管理器复制图像请使用 Ctrl+V。\n也可以将图像文件拖入提示词。"
"shortcuts.pseudo.undo_long_help" = "撤销提示词编辑器中的最后一次更改。\n涵盖输入、删除、行/词级剪切以及清空草稿。"
"shortcuts.pseudo.redo_long_help" = "重做提示词编辑器中刚撤销的更改。\nCtrl+Shift+Z 为主快捷键；Ctrl+R 为备选。"
"shortcuts.pseudo.history_long_help" = "召回之前发送过的提示词。\n在空提示词上按 Up 浏览较早的提示词，最新的在前；每次移动都会实时填充编辑器，方便修改后重新发送。\n若已有排队提示词，Up 会把焦点移到队列窗格的最后一行。\n运行 /history 打开可搜索的历史面板，并按文本过滤。"
"shortcuts.pseudo.search_scrollback_long_help" = "搜索会话滚动区中的文本并在匹配之间跳转。\n在提示词输入中运行 /find 进行搜索。在 vim 模式下，滚动区获得焦点时也可以按 /。\n输入查询后，使用 n 和 N（或方向键）在匹配之间切换。按 Enter 跳转到匹配处，按 Esc 关闭。"
